# Builds "Dino Day.app" for Apple Silicon Macs and attaches it to a GitHub release.
# Run it: push a tag that starts with "mac-v" (for example mac-v1.0.1), or use
# Actions > Mac release > Run workflow.
name: Mac release

on:
  push:
    tags: ['mac-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (for example mac-v1.0.1)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the page
        run: |
          python3 build.py
          mkdir -p mac/www
          cp dist/www/* mac/www/

      - name: Package the app
        working-directory: mac
        run: |
          npm install --no-audit --no-fund
          iconutil -c icns icon.iconset -o icon.icns
          npx @electron/packager . "Dino Day" --platform=darwin --arch=arm64 --icon=icon.icns --overwrite --out=dist \
            --app-bundle-id=co.stumpandroot.dinoday.mac --app-category-type=public.app-category.productivity
          APP="dist/Dino Day-darwin-arm64/Dino Day.app"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "../Dino-Day-mac.zip"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          NOTES="Dino Day for Mac (Apple Silicon). Download Dino-Day-mac.zip, unzip it, and drag Dino Day.app into Applications. First launch: open it once, then go to System Settings > Privacy & Security and click Open Anyway."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" Dino-Day-mac.zip --clobber
          else
            gh release create "$TAG" Dino-Day-mac.zip --title "Dino Day for Mac ($TAG)" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
