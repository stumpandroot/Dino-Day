<style>
/* Layout: Rex's illustrated world on top, a cream task sheet sliding over it; pull the world down to play */
:root{
  --page:#F6E4D6; --cream:#FBF1E7; --sheet:#FFF9F2; --card:#FFFFFF; --chip:#F5EEE4; --line:#EFE4D6; --ink:#24453A; --text:#3A4A42; --muted:#7D867C;
  --sage:#8DB07A; --olive:#4F7A4F; --olive-ink:#24453A; --coral:#EE7F62; --coral-ink:#fff; --teal:#4F8C80;
  --peach:#FBE3D4; --mint:#E3EDD3; --upnext:#DDE9CB; --sky:#E1ECF4; --lav:#ECE6F5; --rose:#FBE1E1; --butter:#FCEFCB;
  --glass:rgba(255,250,243,.86); --toast:#24453A; --toast-ink:#fff; --shadow:rgba(90,60,30,.10);
  --display:"Fredoka",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:30px; --r-md:20px; --r-sm:12px;
  color-scheme:light;
}
/* the UI follows the sky: same soft palette, dimmed at golden hour, dusky at dusk, deep at night */
.app[data-phase=golden]{ --cream:#FAEBDD; --sheet:#FFF4EA; --chip:#F7EBDD; --line:#F0DFCC; --upnext:#EFE0C2; --mint:#EEE5CC; }
html[data-phase=dusk]{ --page:#E9DCE3; }
html[data-phase=night]{ --page:#151A28; }
.app[data-phase=dusk]{ --page:#E9DCE3; --cream:#F1E6EA; --sheet:#F8F0F1; --card:#FFFBFB; --chip:#EFE5EA; --line:#E6D8DF; --ink:#33364F; --text:#3E4258; --muted:#857F92;
  --mint:#E4E6EE; --upnext:#E3DDEF; --peach:#F5DCD8; --sky:#DDE3F1; --lav:#E5DDF1; --rose:#F5DCE0; --butter:#F3E7CF; --olive:#5A6C8C; --olive-ink:#33364F;
  --glass:rgba(250,243,246,.84); --toast:#33364F; }
.app[data-phase=night]{ --page:#151A28; --cream:#1C2233; --sheet:#20273A; --card:#2A3248; --chip:#323B53; --line:#363F57; --ink:#F1EADF; --text:#E3DCD2; --muted:#9AA2B6;
  --sage:#7FA77A; --olive:#A9C59A; --olive-ink:#E9F0DE; --coral:#F08D70; --coral-ink:#2A1A14;
  --mint:#2E3D3D; --upnext:#2D3F3A; --peach:#43363A; --sky:#2C3A50; --lav:#363553; --rose:#46343D; --butter:#433D33;
  --glass:rgba(32,39,58,.84); --toast:#F1EADF; --toast-ink:#20273A; --shadow:rgba(0,0,0,.35); color-scheme:dark; }
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--coral);outline-offset:2px}
.app{position:fixed;inset:0;max-width:480px;height:auto;margin:0 auto;background:var(--cream);overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 20px 60px rgba(60,50,30,.15)}
@media (min-width:520px) and (min-height:600px){.app{top:16px;bottom:16px;width:min(480px,calc(100% - 32px));max-height:932px;margin:auto;border-radius:32px}}

/* ---------- world ---------- */
.world{position:absolute;inset:0 0 auto 0;height:var(--worldH,38%);transition:height .55s cubic-bezier(.2,.8,.2,1);overflow:hidden;touch-action:pan-x;user-select:none}
.app.expanded .world{height:100%}
.world svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.layer{transition:transform .9s ease-out}
.world .zoom{position:absolute;inset:0;transform-origin:50% 80%;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.app.expanded .world .zoom{transform:scale(1.04);bottom:calc(env(safe-area-inset-bottom,0px) + 104px)}
.world{background:var(--groundC,#74A85B)}
.world .zoom{transition:transform .7s cubic-bezier(.2,.8,.2,1),bottom .55s cubic-bezier(.2,.8,.2,1)}
.rex{position:absolute;bottom:var(--ground,14%);left:0;width:var(--rexW,120px);transform-origin:50% 100%;pointer-events:auto;cursor:pointer;touch-action:none}
.rex .body{position:relative;width:100%;transform-origin:50% 100%}
.rex svg{display:block;width:100%;height:auto;aspect-ratio:536/688;overflow:visible;pointer-events:none;position:relative}
.rexlayer{position:absolute;inset:0;pointer-events:none;z-index:15}
.acctf{display:flex;flex-direction:column;gap:10px}.acctf label{display:flex;flex-direction:column;gap:4px;font:600 13px var(--display);color:var(--ink)}
.acctf input{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font:16px var(--body);color:var(--ink);background:var(--card)}
.acctb{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:4px}.acctb .pill{width:100%}
.row .pill{white-space:nowrap}
.deskbtn{display:grid;place-items:center;width:34px;height:34px;border-radius:999px;background:var(--glass);color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.12)}
/* contact shadow: soft and darkest at the middle; it fades while he is off the ground */
.rex .shadow{left:22%;right:14%;bottom:-7px;height:18px;background:radial-gradient(closest-side,rgba(25,20,35,calc(var(--shadowA,.22)*1.9)),rgba(25,20,35,0));filter:blur(1px);transition:opacity .15s}
.rex.lifted .shadow{opacity:0}
.dropshadow{position:absolute;left:0;top:0;height:16px;border-radius:50%;background:radial-gradient(closest-side,rgba(25,20,35,.38),rgba(25,20,35,0));opacity:0;pointer-events:none}
.rexlayer .rex{pointer-events:auto;bottom:auto}
.rex.held{cursor:grabbing}
.rexlayer .bubble{z-index:2}
.rex .tint,.rex .rim{position:absolute;inset:0;pointer-events:none;-webkit-mask:var(--rexmask) center/100% 100% no-repeat;mask:var(--rexmask) center/100% 100% no-repeat;transition:background .8s,opacity .8s}
.rex .tint{background:var(--tint,#fff);opacity:var(--tintA,0);mix-blend-mode:multiply}
.rex .rim{background:radial-gradient(circle at var(--rimX,50%) var(--rimY,30%),var(--rim,#fff) 0,transparent 46%);opacity:var(--rimA,0);mix-blend-mode:screen}
.rex .shadow{position:absolute;border-radius:50%;pointer-events:none}
.bubble{position:absolute;left:50%;bottom:50%;transform:translate(-50%,8px) scale(.7);transform-origin:50% 100%;opacity:0;background:var(--card);color:var(--ink);font:600 13.5px/1.3 var(--display);padding:8px 12px;border-radius:16px;max-width:min(270px,80vw);width:max-content;text-align:center;box-shadow:0 4px 14px rgba(40,40,20,.15);transition:opacity .2s,transform .25s cubic-bezier(.3,1.6,.5,1);pointer-events:none;z-index:6}
.bubble.on{opacity:1;transform:translate(-50%,0) scale(1)}
.bubble.btns{pointer-events:auto}
.bubble .bb{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px}
.bubble .bb button{padding:6px 11px;border-radius:999px;background:var(--coral);color:#fff;font:600 12.5px var(--display)}
.bubble .bb button.g{background:var(--chip);color:var(--olive-ink)}
.wakechip[hidden]{display:none}
.wakechip{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;display:flex;align-items:center;gap:8px;background:var(--card);color:var(--olive-ink);font:700 15px var(--display);padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(20,30,50,.3)}
.bubble::after{content:"";position:absolute;left:50%;top:100%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--card)}
.fx{position:absolute;pointer-events:none;z-index:4}
.heart{width:22px;height:22px;animation:rise 1.2s ease-out forwards}
@keyframes rise{0%{transform:translate(0,0) scale(.4);opacity:0}15%{opacity:1;transform:translate(0,-10px) scale(1)}100%{transform:translate(var(--dx,0),-80px) scale(.9);opacity:0}}
.prop{position:absolute;bottom:var(--ground,14%);pointer-events:none;z-index:2}
.fg{position:absolute;bottom:-4%;width:48%;height:40%;pointer-events:none;filter:blur(5px);opacity:0;transition:opacity .6s,filter .6s;z-index:5}
.fg img{position:absolute;bottom:0;max-width:none}
.chips-r{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;display:flex;gap:6px;z-index:5}
.chips-r .timechip,.chips-r .placechip{position:static}
.placechip{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(6px);padding:6px 11px;border-radius:999px;font:600 12.5px var(--display);color:var(--olive-ink)}
.app.expanded .fg{opacity:.95}
.timechip{display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(6px);padding:6px 11px 6px 9px;border-radius:999px;font:600 12.5px var(--display);color:var(--olive-ink);z-index:5}
.timechip svg{width:16px;height:16px}
.expandbtn{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;display:flex;align-items:center;gap:6px;background:var(--glass);backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;font:600 12.5px var(--display);color:var(--olive-ink);z-index:5}
.app.expanded .expandbtn .lbl-open{display:none}
.app:not(.expanded) .expandbtn .lbl-close{display:none}

/* play bar */
.playbar{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:grid;grid-template-columns:repeat(6,1fr);gap:6px;background:var(--glass);backdrop-filter:blur(8px);border-radius:24px;padding:8px;box-shadow:0 10px 30px rgba(40,40,20,.18);transform:translateY(140%);transition:transform .5s cubic-bezier(.2,.8,.2,1);z-index:6}
.app.expanded .playbar{transform:none}
.playbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;border-radius:16px;font:600 12px var(--display);color:var(--ink)}
.playbar button:hover{background:var(--mint)}
.playbar .ic{width:38px;height:38px;border-radius:13px;display:grid;place-items:center}
.playbar .ic svg{width:22px;height:22px}

/* ---------- sheet ---------- */
.sheet{position:absolute;left:0;right:0;bottom:0;top:calc(var(--worldH,38%) - 26px);background:var(--sheet);border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;flex-direction:column;transition:top .55s cubic-bezier(.2,.8,.2,1),transform .55s cubic-bezier(.2,.8,.2,1);box-shadow:0 -8px 30px rgba(60,50,20,.08);z-index:7}
.app.expanded .sheet{transform:translateY(105%)}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0;flex:none}
.scroll{flex:1;overflow-y:auto;padding:10px 18px 110px;overscroll-behavior:contain}
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.hello h1{font:700 24px/1.12 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.hello .date{color:var(--muted);font-size:13.5px;margin-top:3px}
.next{display:flex;align-items:center;gap:12px;background:var(--mint);border-radius:var(--r-md);padding:12px 12px 12px 14px;margin-bottom:16px}
.next .who{width:38px;height:38px;border-radius:12px;background:var(--card);display:grid;place-items:center;flex:none;overflow:hidden}
.next .who img{width:34px;margin-top:6px}
.next .txt{flex:1;min-width:0}
.next .k{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}
.next .t{font:600 15px/1.3 var(--display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.next .acts{display:flex;gap:6px;flex:none}
.pill{border-radius:999px;padding:8px 13px;font:600 13px var(--display)}
.pill.coral{background:var(--coral);color:var(--coral-ink)}
.pill.ghost{background:var(--card);color:var(--olive-ink)}
.next.focus{background:#F3E7D3}
.add{display:flex;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:6px 6px 6px 14px;margin-bottom:12px}
.add input{flex:1;min-width:0;border:0;outline:0;background:none;font:16px var(--body);color:var(--ink);padding:7px 0}
.add input::placeholder{color:#A9AE9F}
.add button{width:36px;height:36px;border-radius:12px;background:var(--olive);color:#fff;display:grid;place-items:center;flex:none}
.cats{display:flex;gap:6px;margin:-4px 0 12px;flex-wrap:wrap}
.cats button{padding:5px 11px;border-radius:999px;font:600 12.5px var(--display);background:var(--chip);color:var(--muted)}
.cats button[aria-pressed="true"]{background:var(--olive);color:#fff}
.list{display:flex;flex-direction:column;gap:9px}
.task{display:flex;align-items:center;gap:11px;background:var(--card);border-radius:var(--r-md);padding:11px 8px 11px 11px;box-shadow:0 1px 0 var(--line),0 2px 10px rgba(60,50,20,.04);transition:transform .25s,opacity .25s}
.task .tile{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none}
.task .tile svg{width:24px;height:24px}
.task .tt{flex:1;min-width:0}
.task .title{font:600 15px/1.3 var(--body)}
.task .meta{font-size:12.5px;color:var(--muted)}
.task .more{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.task .check{width:44px;height:44px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.06)}
.task .check svg{width:22px;height:22px;opacity:.35}
.task.done .check{background:var(--sage)}
.task.done .check svg{opacity:1;color:#fff}
.task.done .title{text-decoration:line-through;color:var(--muted)}
.task.leaving{transform:translateX(30px);opacity:0}
.section{display:flex;align-items:center;justify-content:space-between;margin:20px 2px 9px;font:700 14px var(--display);color:var(--muted)}
.section button{font:600 13px var(--display);color:var(--olive)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--card);border-radius:var(--r-md);border:1.5px dashed var(--line)}
.menu{position:absolute;right:52px;z-index:20;background:var(--card);border-radius:14px;box-shadow:0 10px 30px rgba(40,40,20,.18);padding:6px;display:flex;flex-direction:column;min-width:170px}
.menu button{text-align:left;padding:10px 12px;border-radius:10px;font:600 14px var(--body)}
.menu button:hover{background:var(--mint)}

/* tabs */
.tabs{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--glass);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px 8px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:8}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11.5px var(--display);color:#A3A897;padding:4px 10px;border-radius:12px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current="page"]{color:var(--olive-ink)}
.tabs button[aria-current="page"] .dot{opacity:1}
.tabs .dot{width:4px;height:4px;border-radius:50%;background:var(--coral);opacity:0}
.app.expanded .tabs{transform:translateY(110%);transition:transform .4s}
.tabs{transition:transform .4s}
.toast{position:absolute;left:50%;bottom:86px;transform:translate(-50%,20px);opacity:0;background:var(--toast);color:var(--toast-ink);font:600 13px var(--display);padding:9px 14px;border-radius:999px;transition:all .3s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.group{background:var(--card);border-radius:var(--r-md);padding:4px 14px;box-shadow:0 1px 0 var(--line);margin-bottom:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .lab{font:600 15px var(--body)}
.row .hint{font-size:12.5px;color:var(--muted)}
.row input[type=text]{width:150px;max-width:50%;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;font:16px var(--body);color:var(--ink);background:var(--cream)}
.seg{display:flex;background:var(--chip);border-radius:999px;padding:3px;flex:none}
.seg button{padding:6px 11px;border-radius:999px;font:600 12.5px var(--display);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--olive-ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.rowcol{flex-direction:column;align-items:stretch}
.glabel{font:700 12px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px}
.danger{color:#C2553F;font:600 14px var(--display);padding:12px 0}

/* ---------- ported features ---------- */
.hello{align-items:center}
.hello .pill{flex:none}
.pill.mint{background:var(--mint);color:var(--olive-ink)}
.pill.sm{padding:6px 11px;font-size:12.5px}
.link{font:600 13.5px var(--display);color:var(--olive);padding:6px 4px}
.hint{font-size:12.5px;color:var(--muted)}
.hint.pad{padding:14px 0}
.fcard{background:var(--mint);border-radius:var(--r-md);padding:13px 14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.fcard.insess{background:#F3E7D3}
.fhead{display:flex;gap:12px;align-items:center}
.fhead .who{width:42px;height:42px;border-radius:13px;background:var(--card);display:grid;place-items:center;flex:none;overflow:hidden}
.fhead .who img{width:38px;margin-top:8px}
.fhead .txt{flex:1;min-width:0}
.fcard .k{font:700 11px var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--olive)}
.fcard .ft{font:600 17px/1.25 var(--display);text-wrap:balance}
.acts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.acts.small{gap:2px;margin-top:-4px}
.steps{display:flex;flex-direction:column;gap:4px}
.step{display:flex;align-items:center;gap:9px;text-align:left;padding:6px 8px;border-radius:10px;font:600 14px var(--body);color:var(--ink)}
.step.next{background:rgba(255,255,255,.7)}
.step.done{color:var(--muted);text-decoration:line-through}
.step .sb{width:20px;height:20px;border-radius:7px;background:var(--card);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1.5px #D8D2C4}
.step.done .sb{background:var(--sage);box-shadow:none;color:#fff}
.step .sb svg{width:14px;height:14px}
.opts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.olbl{width:100%;font:700 12px var(--display);color:var(--olive);margin-top:2px}
.chip{padding:7px 12px;border-radius:999px;background:var(--card);font:600 13px var(--display);color:var(--olive-ink)}
.chip.on{background:var(--olive);color:#fff}
.sess{display:flex;align-items:center;gap:12px}
.ring{width:54px;height:54px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:4}
.ring .rbg{stroke:#E6D7BD}
.ring .rfill{stroke:var(--coral);stroke-linecap:round;transition:stroke-dashoffset .5s linear}
.stime{font:700 24px var(--display);font-variant-numeric:tabular-nums}
.pickc .stickies{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.sticky{min-height:86px;padding:10px;border-radius:6px 6px 14px 6px;font:600 13.5px/1.25 var(--display);color:#3A3320;text-align:left;box-shadow:0 3px 8px rgba(60,50,20,.12);transition:transform .2s}
.sticky:hover{transform:translateY(-2px) rotate(-1deg)}
.sticky.s0{background:#FCE9A8;transform:rotate(-2deg)}.sticky.s1{background:#F9D3C4;transform:rotate(1.5deg)}.sticky.s2{background:#D8EAC8;transform:rotate(-1deg)}
.nudge{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#FFF4E2;border-radius:var(--r-md);padding:11px 12px;margin-bottom:10px}
.nudge .nt{flex:1 1 180px;font:600 14px/1.35 var(--body)}
.nudge.wrap{flex-direction:column;align-items:stretch;background:#EEE9F6}
.wrow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.wrow span:first-child{font:600 14px var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tline{background:var(--card);border-radius:var(--r-md);padding:10px 14px 12px;margin-bottom:14px;box-shadow:0 1px 0 var(--line)}
.tlhead{display:flex;justify-content:space-between;font:600 13px var(--display);color:var(--muted);margin-bottom:6px}
.tlhead b{color:var(--ink)}

/* ================= v8 UI pass: mockup look (logo, soft palette, rounded type) ================= */
body{color:var(--text);transition:background .8s}
.app{background:var(--cream);transition:background .8s}
.sheet,.tabs,.card,.group,.task,.tline,.stat,.hab,.empty,.menu{transition:background-color .8s,color .8s,border-color .8s}
h1,h2,.hello h1,.card h2{color:var(--ink)}

.link{color:var(--olive)}
.section{font:600 17px var(--display);color:var(--ink);margin:18px 2px 8px}

/* up next */

.fmeta{flex-wrap:nowrap;gap:10px}.fmeta .go{margin-left:auto;padding:10px 14px;font-size:14px;white-space:nowrap}.fcard.mini{gap:8px}

.tlmini .nowm{top:5px;bottom:5px;width:9px;height:9px;margin:4px 0 0 -4.5px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 3px var(--card)}
.tltrack{background:none;height:74px}
.tltrack .tlline{position:absolute;left:0;right:0;top:27px;height:3px;border-radius:3px;background:var(--chip)}
.tltrack .tlpast{top:27px}

/* autonomy */
function autonomous(){
  if (bubble.classList.contains('btns')) return;
  if (carry || fall || rex.away) return;
  if (S.asleep){ rex.sleeping = true; rex.sitting = 1; return; }
  if (petting || rex.state==='walk' || rex.chase || rex.reading || props.apple || (rex.busyUntil || 0) > Date.now()) return;
  if (!S.asleep && Math.random() < .06){ danceRex(Math.random() < .6 ? 'Dance' : 'Boogie'); return; }
  if (place() === 'meadow' && !S.asleep && Math.random() < .22 && typeof FX !== 'undefined' && FX.visit){ FX.visit(); return; }
  const night = phase()==='night';
  if (night && Math.random()<.5){ if (!rex.sleeping){ rex.sleeping = true; rex.sitting = 1; rex.say('Zzz…', 2000); } return; }
  if (rex.sleeping){ if ((rex.napUntil || 0) > Date.now()) return; if (Math.random()<.3){ rex.sleeping=false; rex.sitting=0; rex.say('*yawn*', 1200); } return; }
  const r = Math.random();
  if (r < .45) rex.goTo(.12 + Math.random()*.76);
  else if (r < .6){ rex.sitting = 1; }
  else if (r < .72){ rex.face *= -1; }
  else if (r < .8){ rex.hop = 1; }
  else if (r < .86 && !night && phase()!=='dusk'){ rex.goTo(bfly.x/1672, ()=> rex.say(pick(['Come back, butterfly!','So fast…']), 1500)); }
  else if (r < .9 && talk(.8)) rex.say(pick(['Hmm hmm hm…','*sniff sniff*','I like it here.','What\'s that?']), 1500);
}

    if (a === 'start') startSession(f);

    else if (a === 'step'){ const i = f.steps.findIndex(s => !s.done); if (i >= 0) stepDone(f, i); }

      fc.fillStyle = `rgba(255,220,150,${.5 + .5*Math.sin(b.t*9 + b.i)})`; fc.beginPath(); fc.arc(b.x, b.y, 1.6, 0, 6.28); fc.fill(); return; }
    if (b.kind === 'firefly'){ const tx = b.home ? b.home[0] : W*(.1 + (b.i*.0617 % 1)*.8), ty = H*(.48 + (b.i*.137 % 1)*.4);

      const R = 14; const gr = fc.createRadialGradient(b.x, b.y, 0, b.x, b.y, R); gr.addColorStop(0, `rgba(255,236,150,${.9*g})`); gr.addColorStop(1, 'rgba(255,236,150,0)'); fc.fillStyle = gr; fc.fillRect(b.x - R, b.y - R, R*2, R*2);
      fc.fillStyle = `rgba(255,250,210,${.4 + .6*g})`; fc.beginPath(); fc.arc(b.x, b.y, 2, 0, 6.28); fc.fill(); return; }
    if (b.kind === 'moth'){ const hx = sx(500), hy = sy(330); const a = b.t*(1.8 + b.i*.5) + b.i*3; b.vx += (hx + Math.cos(a)*55*M.s*2 - b.x)*.02; b.vy += (hy + Math.sin(a*1.3)*35*M.s*2 - b.y)*.02; b.vx *= .82; b.vy *= .82; b.x += b.vx; b.y += b.vy;
      const fl = Math.abs(Math.sin(b.t*30)); fc.fillStyle = 'rgba(235,220,200,.85)'; fc.beginPath(); fc.ellipse(b.x - 3, b.y, 4*fl + 1, 3, 0, 0, 6.28); fc.ellipse(b.x + 3, b.y, 4*fl + 1, 3, 0, 0, 6.28); fc.fill(); return; }
    if (b.kind === 'ladybug'){ const y = sy(438); b.x += b.dir*12*dt*M.s*2; if (b.x > sx(1170) || b.x < sx(760)) b.dir *= -1; if (b.scared){ b.y -= 40*dt; } else b.y += (y - b.y)*.1;
      fc.save(); fc.translate(b.x, b.y); fc.scale(b.dir, 1); fc.fillStyle = '#D9483B'; fc.beginPath(); fc.arc(0, 0, 4, Math.PI, 0); fc.fill(); fc.fillStyle = '#2A2220'; fc.beginPath(); fc.arc(4, -1, 2, 0, 6.28); fc.fill(); fc.fillRect(-.5, -4, 1, 4); fc.restore(); return; }
  }
  function drawBit(b, dt){ const a = Math.max(0, b.life);
    if (b.kind === 'leaf' || b.kind === 'petal' || b.kind === 'confetti'){ b.vy = Math.min(b.vy + .04, 1.4); b.vx += Math.sin(b.life*12)*.06 + gust*.1; b.x += b.vx; b.y += b.vy; b.rot += .08;
      fc.save(); fc.translate(b.x, b.y); fc.rotate(b.rot); fc.globalAlpha = a; fc.fillStyle = b.c || '#fff'; fc.beginPath(); fc.ellipse(0, 0, b.r, b.r*.5, 0, 0, 6.28); fc.fill(); fc.restore(); return; }
    if (b.kind === 'sparkle' || b.kind === 'glow' || b.kind === 'ember'){ b.x += b.vx*.6; b.y += b.vy*.6; b.vx *= .94; b.vy *= .94;
      fc.fillStyle = b.kind === 'ember' ? `rgba(255,170,80,${a})` : b.kind === 'glow' ? `rgba(255,226,160,${a*.8})` : `rgba(255,255,240,${a*.9})`; fc.beginPath(); fc.arc(b.x, b.y, b.r*a + .5, 0, 6.28); fc.fill(); return; }
    if (b.kind === 'smoke'){ b.x += b.vx; b.y += b.vy; b.r += .12; fc.fillStyle = `rgba(235,235,240,${a*.35})`; fc.beginPath(); fc.arc(b.x, b.y, b.r, 0, 6.28); fc.fill(); return; }
    if (b.kind === 'star'){ b.x += b.vx; b.y += b.vy; const g = fc.createLinearGradient(b.x - b.vx*10, b.y - b.vy*10, b.x, b.y); g.addColorStop(0, 'rgba(255,250,220,0)'); g.addColorStop(1, `rgba(255,250,220,${a})`); fc.strokeStyle = g; fc.lineWidth = 2; fc.beginPath(); fc.moveTo(b.x - b.vx*10, b.y - b.vy*10); fc.lineTo(b.x, b.y); fc.stroke(); return; }
    if (b.kind === 'bird'){ b.t += dt; b.x += b.vx; b.y += b.vy; b.vy *= .99; const f = Math.sin(b.t*14)*5; fc.strokeStyle = `rgba(50,45,50,${a})`; fc.lineWidth = 2; fc.beginPath(); fc.moveTo(b.x - 7, b.y - f); fc.quadraticCurveTo(b.x - 3, b.y - 2, b.x, b.y); fc.quadraticCurveTo(b.x + 3, b.y - 2, b.x + 7, b.y - f); fc.stroke(); return; }
  }
  function grass(dt, t, rx, ry){ if (!tufts.length) return; const ph = artPh(); const col = { day:['#6E8A3A','#88A24A'], golden:['#5C4A1C','#7A6226'], dusk:['#3A3A26','#4A4630'], night:['#17323A','#21424A'] }[ph] || ['#6E8A3A','#88A24A'];
    const baseY = H - 2;
    for (const g of tufts){ const x = g.x*W; let force = Math.sin(t*1.3 + g.x*9)*.06 + gust*.5;
      if (ptr && Math.abs(ptr.x - x) < 40 && ptr.y > baseY - 80) force += ptrV.x*.04;
      if (Math.abs(rx - x) < 30 && (rex.state === 'walk')) force += Math.sign(x - rx)*.5;
      g.bv += (force - g.b)*.2 - g.bv*.15; g.b += g.bv*dt*10;
      for (let k = -1; k <= 1; k++){ const h = g.h*(k ? .75 : 1)*Math.max(.7, M.s*1.6), bx = x + k*5; fc.fillStyle = col[(k + 1)%2];
        fc.beginPath(); fc.moveTo(bx - 3, baseY); fc.quadraticCurveTo(bx + g.b*h*.5 + k*2, baseY - h*.55, bx + g.b*h + k*4, baseY - h); fc.quadraticCurveTo(bx + g.b*h*.3 + 1, baseY - h*.4, bx + 3, baseY); fc.fill(); } } }
  function edgeLight(K, rx, ry){ // move Rex's rim light toward the strongest nearby light
    if (!K.length) return; let best = null, bw = 0; for (const [x, y, c, s] of K){ const px = sx(x + dxArt()), py = sy(y), d = Math.hypot(px - rx, py - (ry - 60)); const w = s/(1 + d/(300*M.s*2)); if (w > bw){ bw = w; best = [px, py, c]; } }
    if (!best) return; const dir = (best[0] - rx)*rex.face; const xPct = dir < -20 ? '-8%' : dir > 20 ? '108%' : '50%', yPct = best[1] < ry - 200 ? '-10%' : '30%';
    rexEl.style.setProperty('--rimX', xPct); rexEl.style.setProperty('--rimY', yPct); rexEl.style.setProperty('--rim', `rgb(${best[2]})`);
    const base = +rexEl.style.getPropertyValue('--rimBase') || .3; rexEl.style.setProperty('--rimA', Math.min(.7, base*(.6 + bw*1.2)).toFixed(3)); }

  addEventListener('resize', () => setTimeout(resize, 50));
  new ResizeObserver(() => resize()).observe(zoom);
  function where(id){ mapping(); const h = HOT[place()].find(x => x.id === id); if (!h) return null; const x = h.x || (h.box[0] + h.box[2])/2, y = h.y || (h.box[1] + h.box[3])/2; return { x: sx(x + dxArt()), y: sy(y) }; }
  return { step, seed, resize, tap, where, visit, hitAt:(x, y) => { const h = hitAt(x, y); return h ? (h.hot ? h.hot.id : 'bug:' + h.bug.kind) : null; } };
})();

/*__PLATFORM__*/

/* boot */
rollover(); S.lastOpen = Date.now(); save(); checkUnlocks(); paintPlaybar();
drawScene(); render(); paintWake(); if (S.asleep){ rex.sleeping = true; rex.sitting = 1; }
requestAnimationFrame(frame); setTimeout(restoreSpot, 400);
if (!S.onboarded) setTimeout(onboard, 500);
else { setTimeout(morning, 600); setTimeout(() => { if (!bubble.classList.contains('on') && !S.asleep) rex.say(phase()==='night' ? 'Hi… it\'s late.' : `${greet()}!`, 1800); }, 900); }
setInterval(()=>{ if (!preview && !S.lockDay) drawScene(); }, 60000);
